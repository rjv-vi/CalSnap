name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App version name (e.g. 1.0.1)'
        required: false
        default: ''
      version_code:
        description: 'App version code (integer, must increase each release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. See ANDROID.md for setup."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="0.0.0-$(date -u +%Y%m%d%H%M)"
          fi
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            VERSION_CODE="${{ github.event.inputs.version_code }}"
          else
            VERSION_CODE="$GITHUB_RUN_NUMBER"
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION_NAME (code $VERSION_CODE)"

      - name: Patch version into twa-manifest.json
        run: |
          python3 - <<'EOF'
          import json, os
          with open('twa-manifest.json', 'r', encoding='utf-8') as f:
              m = json.load(f)
          m['appVersionName'] = os.environ['VERSION_NAME']
          m['appVersion']     = int(os.environ['VERSION_CODE'])
          m['appVersionCode'] = int(os.environ['VERSION_CODE'])
          with open('twa-manifest.json', 'w', encoding='utf-8') as f:
              json.dump(m, f, indent=2, ensure_ascii=False)
          EOF
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}

      - name: Initialise Bubblewrap project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ./android-build
          cp twa-manifest.json ./android-build/twa-manifest.json
          cp android.keystore  ./android-build/android.keystore
          cd ./android-build
          # Bubblewrap reads twa-manifest.json from the working dir.
          bubblewrap update --skipVersionUpgrade

      - name: Build APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: ./android-build
        run: |
          # Bubblewrap build prompts for keystore + key passwords on stdin
          # in non-interactive mode; piping them avoids prompts hanging CI.
          printf '%s\n%s\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" | \
            bubblewrap build --skipPwaValidation

      - name: Rename artifacts
        working-directory: ./android-build
        run: |
          mkdir -p ../release-artifacts
          cp app-release-signed.apk ../release-artifacts/calsnap-${{ steps.version.outputs.version_name }}.apk || \
          cp ./app/build/outputs/apk/release/app-release.apk ../release-artifacts/calsnap-${{ steps.version.outputs.version_name }}.apk || true
          cp app-release-bundle.aab ../release-artifacts/calsnap-${{ steps.version.outputs.version_name }}.aab || \
          cp ./app/build/outputs/bundle/release/app-release.aab ../release-artifacts/calsnap-${{ steps.version.outputs.version_name }}.aab || true
          ls -la ../release-artifacts/

      - name: Upload artifacts (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: calsnap-android-${{ steps.version.outputs.version_name }}
          path: release-artifacts/*

      - name: Publish to GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
