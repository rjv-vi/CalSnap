name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App version name (e.g. 1.0.1)'
        required: false
        default: ''
      version_code:
        description: 'App version code (integer, must increase each release)'
        required: false
        default: ''

# Top-level permissions intentionally minimal: per-job we narrow further.
# `contents: write` is needed by the publish step to create a Release.
permissions:
  contents: read

# Cancel an in-progress build for the same ref when a new push lands. Tag
# pushes are unique by definition; for workflow_dispatch we group by the
# run id so independent manual runs don't cancel each other.
concurrency:
  group: android-build-${{ github.ref }}-${{ github.event.inputs.version_name || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Needed only by `softprops/action-gh-release` to publish the Release.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the checkout shallow but make sure the tag we built from
          # is included in the working tree (default fetch-depth=1 pulls
          # the tag commit on tag pushes, so this is just defensive).
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap (skip first-run JDK/SDK prompts)
        run: |
          # Bubblewrap CLI prompts interactively on first run for JDK + SDK
          # paths and writes them to ~/.bubblewrap/config.json. Pre-creating
          # that file with the action-provided paths makes every later
          # command (init/update/build) fully non-interactive.
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<JSON
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          JSON
          cat "$HOME/.bubblewrap/config.json"

          # Bubblewrap's `build` command validates the SDK by checking for a
          # legacy `$ANDROID_SDK/tools/` directory, which `setup-android@v3`
          # no longer creates (the modern layout puts everything under
          # `cmdline-tools/latest/`). Symlink the new location into the old
          # name so the validator passes.
          if [ ! -e "$ANDROID_HOME/tools" ] && [ -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          fi
          ls -la "$ANDROID_HOME/" | head -10

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. See ANDROID.md for setup."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore

      - name: Determine version
        id: version
        env:
          # Pass user-controllable inputs through env vars instead of
          # ${{ }} interpolation inside the shell script (prevents shell
          # injection from a crafted workflow_dispatch input).
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          if [ -n "$INPUT_VERSION_NAME" ]; then
            VERSION_NAME="$INPUT_VERSION_NAME"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="0.0.0-$(date -u +%Y%m%d%H%M)"
          fi
          if [ -n "$INPUT_VERSION_CODE" ]; then
            VERSION_CODE="$INPUT_VERSION_CODE"
          else
            VERSION_CODE="$GITHUB_RUN_NUMBER"
          fi
          # Reject anything that isn't a safe semver-ish or integer to keep
          # the value harmless even if it later flows through other shells.
          if ! [[ "$VERSION_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid version_name (allowed: A-Z a-z 0-9 . _ -)"
            exit 1
          fi
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid version_code (must be a positive integer)"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION_NAME (code $VERSION_CODE)"

      - name: Patch version into twa-manifest.json
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          python3 - <<'EOF'
          import json, os
          with open('twa-manifest.json', 'r', encoding='utf-8') as f:
              m = json.load(f)
          m['appVersionName'] = os.environ['VERSION_NAME']
          m['appVersion']     = int(os.environ['VERSION_CODE'])
          m['appVersionCode'] = int(os.environ['VERSION_CODE'])
          with open('twa-manifest.json', 'w', encoding='utf-8') as f:
              json.dump(m, f, indent=2, ensure_ascii=False)
          EOF

      - name: Initialise Bubblewrap project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ./android-build
          cp twa-manifest.json ./android-build/twa-manifest.json
          cp android.keystore  ./android-build/android.keystore
          cd ./android-build
          # Bubblewrap reads twa-manifest.json from the working dir and
          # generates the full Android Studio project from scratch.
          # --skipVersionUpgrade keeps the versionCode/versionName as patched
          # by the previous step instead of bubblewrap auto-bumping them.
          # Pipe "n" repeatedly so that any unforeseen interactive prompt
          # falls back to the default. `|| true` swallows the SIGPIPE/141
          # `yes` receives when bubblewrap closes its stdin, which would
          # otherwise fail the step under bash's default `pipefail`.
          (yes n || true) | bubblewrap update --skipVersionUpgrade

      - name: Build APK + AAB
        env:
          # Bubblewrap reads these two env vars in non-interactive mode and
          # skips the password prompts entirely. Piping passwords on stdin
          # is fragile because inquirer.js requires a TTY: when the pipe is
          # exhausted between the first and second prompt, it treats EOF as
          # Ctrl+C and exits 130.
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: ./android-build
        run: |
          bubblewrap build --skipPwaValidation

      - name: Rename artifacts
        working-directory: ./android-build
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          mkdir -p ../release-artifacts
          cp app-release-signed.apk "../release-artifacts/calsnap-${VERSION_NAME}.apk" || \
            cp ./app/build/outputs/apk/release/app-release.apk "../release-artifacts/calsnap-${VERSION_NAME}.apk" || true
          cp app-release-bundle.aab "../release-artifacts/calsnap-${VERSION_NAME}.aab" || \
            cp ./app/build/outputs/bundle/release/app-release.aab "../release-artifacts/calsnap-${VERSION_NAME}.aab" || true
          ls -la ../release-artifacts/

      - name: Upload artifacts (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          # Safe: this is a YAML value passed to the action, not a shell
          # interpolation. version_name has already been validated against
          # a strict allowlist in the Determine version step.
          name: calsnap-android-${{ steps.version.outputs.version_name }}
          path: release-artifacts/*
          # Keep manual-run artifacts long enough to download/inspect, but
          # not forever — APKs can pile up quickly.
          retention-days: 14
          if-no-files-found: error

      - name: Publish to GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
